name: Deploy index.html to AWS EC2

on:
  push:
    branches: [ main ]
    paths:
      - index.html
      - .github/workflows/deploy-ec2.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy index.html to Amazon Linux EC2
        run: |
          scp index.html "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/index.html"
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
            set -e
            WEB_ROOT="/usr/share/nginx/html"

            if command -v dnf >/dev/null 2>&1; then
              sudo dnf install -y nginx
            else
              sudo yum install -y nginx
            fi

            sudo mv /tmp/index.html "${WEB_ROOT}/index.html"
            sudo chown root:root "${WEB_ROOT}/index.html"
            sudo chmod 644 "${WEB_ROOT}/index.html"
            sudo systemctl enable nginx
            sudo systemctl restart nginx
          EOF

      - name: Verify deployment
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "curl -sf http://localhost/ | grep -E 'shayan|ijlal|noman'"
